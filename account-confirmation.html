<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Account Created | Next LvL</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-image">
    <header class="top-banner">
        <a href="Index.HTML" class="logo-wrap" aria-label="Home page">
            <img src="Images/NextLvl.png" alt="NextLvl Logo" class="site-logo">
        </a>
    </header>

    <main class="page-wrap">
        <section class="section">
            <div class="form-card" style="text-align:center;">
                <img src="Images/NextLvl.png" alt="Logo" style="height:72px; margin-bottom:12px;">
                <h2>Account Created</h2>
                <p id="confirmation-copy" style="color:var(--muted)"></p>
                <div style="margin-top:18px;">
                    <a class="primary-btn" href="Index.HTML">Back to Home</a>
                    <a id="go-to-shop" class="secondary-btn" href="Products.html" style="margin-left:12px;">Continue Shopping</a>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">© 2026 Next LvL Gaming. All rights reserved.</footer>

    <script>
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        const copy = document.getElementById('confirmation-copy');
        const username = user.username || 'Yetti';
        copy.textContent = `You now feel the rage — welcome, ${username}!`;
    </script>
</body>
</html>
