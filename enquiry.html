<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry | Next LvL</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-image">
    <header class="top-banner">
        <a href="Index.HTML" class="logo-wrap" aria-label="Home page">
            <img src="Images/NextLvl.png" alt="NextLvl Logo" class="site-logo">
        </a>

        <nav class="top-nav" aria-label="Main navigation">
            <a class="nav-btn" href="Index.HTML">Home</a>
            <a class="nav-btn" href="About.html">About</a>
            <a class="nav-btn" href="Products.html">Products</a>
            <a class="nav-btn" href="contact.html">Contact</a>
            <a class="nav-btn" href="enquiry.html">Enquiry</a>
            <span id="dynamic-actions"></span>
        </nav>
    </header>

    <main class="page-wrap">
        <section class="section">
            <div class="section-header">
                <span class="kicker">Enquiry</span>
                <h2>Tell us what you need.</h2>
                <p>Submit an enquiry and our team will help you find the perfect gaming setup, product recommendation, or business solution.</p>
            </div>

            <div class="form-card">
                <form>
                    <div class="form-grid">
                        <div>
                            <label for="first-name">First Name</label>
                            <input id="first-name" type="text" placeholder="First name" required>
                        </div>
                        <div>
                            <label for="last-name">Last Name</label>
                            <input id="last-name" type="text" placeholder="Last name" required>
                        </div>
                        <div>
                            <label for="product-type">Interested In</label>
                            <select id="product-type">
                                <option>Gaming Headset</option>
                                <option>Mechanical Keyboard</option>
                                <option>Gaming Mouse</option>
                                <option>Gaming Chair</option>
                                <option>Custom Setup</option>
                            </select>
                        </div>
                        <div>
                            <label for="phone">Phone Number</label>
                            <input id="phone" type="tel" placeholder="+27 00 000 0000">
                        </div>
                        <div class="full">
                            <label for="enquiry-message">Detailed Enquiry</label>
                            <textarea id="enquiry-message" placeholder="Please share your requirements, budget, and timeline..."></textarea>
                        </div>
                    </div>
                    <button class="submit-btn" type="submit">Submit Enquiry</button>
                </form>
            </div>
        </section>
    </main>
    <img src="Images/Enquiry Page.jpg" alt="Gamer HQ Memberships" style="max-width: 100%; margin-top: 24px; border-radius: 18px; border: 1px solid rgba(217, 255, 92, 0.18);">

    <footer class="footer">
        © 2026 Next LvL Gaming. All rights reserved.
    </footer>

    <script>
        (function(){
            const nav = document.getElementById('dynamic-actions');
            const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
            const btn = document.createElement('a');
            btn.className = 'nav-btn';
            btn.style.marginLeft = '8px';
            if (currentUser && currentUser.username) {
                btn.href = 'profile.html';
                btn.textContent = `Yetti: ${currentUser.username}`;
                nav.appendChild(btn);
                const cart = document.createElement('a');
                cart.className = 'nav-btn cart-btn';
                cart.href = 'cart.html';
                cart.style.display = 'inline-flex';
                cart.style.alignItems = 'center';
                cart.style.gap = '8px';
                cart.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden><path d="M6 6h15l-1.5 9h-12L6 6z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="20" r="1" fill="currentColor"/><circle cx="18" cy="20" r="1" fill="currentColor"/></svg><span>Cart</span>';
                nav.appendChild(cart);
            } else {
                btn.href = 'signup.html';
                btn.textContent = 'Sign up';
                nav.appendChild(btn);
            }
        })();
    </script>
</body>
</html>
